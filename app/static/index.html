<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>法律条文问答</title>
<style>
  :root {
    --bg: #0f1115; --panel: #161a22; --line: #262c38;
    --text: #e6e9ef; --muted: #8b93a7; --accent: #4f8cff; --ok: #35c07f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.65 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .meta { color: var(--muted); font-size: 12px; }
  main { flex: 1; overflow-y: auto; padding: 20px; }
  .wrap { max-width: 860px; margin: 0 auto; }
  .empty { color: var(--muted); text-align: center; margin-top: 12vh; }
  .empty kbd {
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    padding: 1px 6px; font-size: 12px;
  }
  .examples { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 18px; }
  .examples button {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 16px; padding: 6px 14px; cursor: pointer; font-size: 13px;
  }
  .examples button:hover { border-color: var(--accent); }
  .msg { margin-bottom: 18px; }
  .role { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .bubble {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: #1d2634; border-color: #2b3a52; }
  .cites { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .cite {
    border-left: 2px solid var(--accent); padding: 6px 10px; background: #12161d;
    border-radius: 4px; font-size: 13px; color: #c3cad8; cursor: pointer;
  }
  .cite .no { color: var(--accent); font-weight: 600; margin-right: 6px; }
  .cite.invalid { border-left-color: #e06060; }
  .cite.invalid .no { color: #e06060; }
  footer { border-top: 1px solid var(--line); padding: 14px 20px; }
  .inputbox { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; }
  textarea {
    flex: 1; resize: none; height: 52px; background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
    font: inherit; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  .send {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 0 22px; font-size: 14px; cursor: pointer;
  }
  .send:disabled { opacity: .5; cursor: not-allowed; }
  .hint { max-width: 860px; margin: 8px auto 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>⚖️ 法律条文问答</h1>
  <span class="meta" id="meta">检索：本地 bge 语义向量 · 生成：加载中…</span>
</header>

<main>
  <div class="wrap" id="list">
    <div class="empty" id="empty">
      问一个法律问题，答案会带出处。<br />
      <span style="font-size:13px">资料范围：《民法典》1260 条</span>
      <div class="examples">
        <button>违约金约定过高，法院可以调整吗？</button>
        <button>男方最早多少岁可以领结婚证？</button>
        <button>借钱到期不还，逾期利息怎么算？</button>
        <button>在加州离婚，房产怎么分？</button>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="inputbox">
    <textarea id="q" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
    <button class="send" id="send">发送</button>
  </div>
  <div class="hint">回答只依据检索到的法条，不确定会说“根据现有资料无法回答”；引用编号可点击查看原文。</div>
</footer>

<script>
const list = document.getElementById('list');
const empty = document.getElementById('empty');
const qEl = document.getElementById('q');
const send = document.getElementById('send');
const meta = document.getElementById('meta');

fetch('/health').then(r => r.json()).then(d => {
  meta.textContent = `检索：${d.index.embedder}（${d.index.n_chunks} 块）· 生成：${d.config.llm}`;
}).catch(() => {});

document.querySelectorAll('.examples button').forEach(b => {
  b.onclick = () => { qEl.value = b.textContent; ask(); };
});

// 服务端渲染模式：直接把结果画出来（截图 / 分享链接 / 无 JS 降级）
if (window.__DEMO__) {
  const d = window.__DEMO__;
  addMsg('user', d.question);
  const bot = addMsg('bot', d.answer);
  const box = bot.querySelector('.cites');
  (d.citations || []).forEach(c => {
    const el = document.createElement('div');
    el.className = 'cite' + (c.valid ? '' : ' invalid');
    el.innerHTML = `<span class="no">[片段${c.index}]</span>` + (c.valid ? escapeHtml(c.text) : '（编号不存在，已拦截）');
    box.appendChild(el);
  });
}

// 支持 ?q=问题 直接发起提问（便于截图与分享具体案例）
const preset = new URLSearchParams(location.search).get('q');
if (preset && !window.__DEMO__) {
  qEl.value = preset;
  setTimeout(() => ask(), 400);
}

qEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
});
send.onclick = ask;

function addMsg(role, text) {
  if (empty) empty.remove();
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  wrap.innerHTML = `<div class="role">${role === 'user' ? '你' : '助手'}</div>
                    <div class="bubble"></div><div class="cites"></div>`;
  wrap.querySelector('.bubble').textContent = text || '';
  list.appendChild(wrap);
  wrap.scrollIntoView({ block: 'end', behavior: 'smooth' });
  return wrap;
}

async function ask() {
  const q = qEl.value.trim();
  if (!q || send.disabled) return;
  qEl.value = '';
  send.disabled = true;
  addMsg('user', q);
  const bot = addMsg('bot', '');
  const bubble = bot.querySelector('.bubble');
  const citesEl = bot.querySelector('.cites');
  const started = performance.now();

  try {
    const resp = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q })
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);

    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const block = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        let ev = 'message', data = '';
        for (const line of block.split('\n')) {
          if (line.startsWith('event:')) ev = line.slice(6).trim();
          else if (line.startsWith('data:')) data += line.slice(5).trim();
        }
        if (ev === 'delta') {
          bubble.textContent += JSON.parse(data).text;
          bot.scrollIntoView({ block: 'end' });
        } else if (ev === 'citations') {
          const cites = JSON.parse(data);
          citesEl.innerHTML = '';
          cites.forEach(c => {
            const div = document.createElement('div');
            div.className = 'cite' + (c.valid ? '' : ' invalid');
            div.innerHTML = `<span class="no">[片段${c.index}]</span>` +
              (c.valid ? escapeHtml(c.text) : '（编号不存在，已拦截）');
            citesEl.appendChild(div);
          });
        } else if (ev === 'error') {
          bubble.textContent += '\n\n[出错] ' + JSON.parse(data).message;
        }
      }
    }
    const sec = ((performance.now() - started) / 1000).toFixed(1);
    meta.dataset.last = sec;
  } catch (err) {
    bubble.textContent += '\n\n请求失败：' + err.message + '（检查服务是否还在运行）';
  } finally {
    send.disabled = false;
    qEl.focus();
  }
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}
</script>
</body>
</html>
