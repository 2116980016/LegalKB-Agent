name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Eval smoke（离线，全流程）
        run: python -m eval.run --all --out-dir results/ci
      - name: Upload eval report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: results/ci/
