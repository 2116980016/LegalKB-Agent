line-length = 120
target-version = "py310"

[lint]
# 只启用"会真出问题"的规则：语法错误、未定义名、未使用导入。
# 不启用风格类规则（E501 行长、S/BLE 安全告警），
# 否则重试逻辑里的 blind-except 会被误报——那是有意为之的降级处理。
select = ["E4", "E7", "E9", "F"]
ignore = ["F541"]

[lint.per-file-ignores]
# 这些入口脚本要先 sys.path.insert(仓库根) 才能 import 本地包，
# 属于"导入不在文件顶部"，是刻意为之。
"eval/run.py" = ["E402"]
"scripts/ask.py" = ["E402"]
"scripts/build_index.py" = ["E402"]
"tests/conftest.py" = ["E402"]
